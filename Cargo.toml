[package]
name = "sds-sdk"
version = "0.1.0"
edition = "2021"
authors = ["UCall SDS Core Team"]
description = "SDS Protocol Core Engine, Domain ID Encoder, Offline Decoder & DNS Inspector"

[lib]
name = "sds_core"
path = "src/lib.rs"

[[bin]]
name = "sds"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
tokio = { version = "1.38", features = ["full"] }
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
hkdf = "0.12"



[dev-dependencies]
rcgen = "0.13"
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring"] }



